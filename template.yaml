AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Public-safe AWS serverless deployment template for the Financials API.

Parameters:
  FinancialsStorageDriver:
    Type: String
    Default: ephemeral
    AllowedValues:
      - ephemeral
      - memory
    Description: Use ephemeral for browser-owned AWS sessions. Memory is available for fake-data smoke tests only.
  FinancialsAllowedOrigins:
    Type: String
    Default: ''
    Description: Comma-separated static UI origins allowed by the API CORS middleware. Keep real values in deploy parameters, not git.
  FinancialsAccessToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: Optional shared access token required in X-Financials-Access-Token for deployed personal-use API requests. Keep real values outside git.
  FinancialsThrottlingRateLimit:
    Type: Number
    Default: 2
    MinValue: 1
    Description: Steady-state requests per second allowed across all API routes before API Gateway returns 429. Throttled requests do not reach Lambda.
  FinancialsThrottlingBurstLimit:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Maximum burst of requests API Gateway accepts above the steady-state rate before returning 429.
  FinancialsReservedConcurrency:
    Type: String
    Default: ''
    AllowedPattern: '^[0-9]*$'
    Description: Optional cap on concurrent Lambda executions, as a cost backstop behind API throttling. Leave blank to skip. AWS rejects this if it would leave fewer than 100 unreserved executions in the account, so new accounts with a low concurrency quota must leave it blank.

Conditions:
  HasReservedConcurrency:
    Fn::Not:
      - Fn::Equals:
          - Ref: FinancialsReservedConcurrency
          - ''

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Architectures:
      - arm64
    Environment:
      Variables:
        FINANCIALS_STORAGE_DRIVER: !Ref FinancialsStorageDriver
        FINANCIALS_ALLOWED_ORIGINS: !Ref FinancialsAllowedOrigins
        FINANCIALS_ACCESS_TOKEN: !Ref FinancialsAccessToken

Resources:
  FinancialsHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: HTTP API for the Financials API Lambda backend.
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref FinancialsThrottlingRateLimit
        ThrottlingBurstLimit: !Ref FinancialsThrottlingBurstLimit

  FinancialsApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Description: Ephemeral Financials API backend for browser-owned AWS sessions.
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      ReservedConcurrentExecutions:
        Fn::If:
          - HasReservedConcurrency
          - Ref: FinancialsReservedConcurrency
          - Ref: AWS::NoValue
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref FinancialsHttpApi
            Path: /
            Method: ANY
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref FinancialsHttpApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  FinancialsApiUrl:
    Description: Base URL for the deployed Financials HTTP API.
    Value: !Sub 'https://${FinancialsHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  FinancialsStorageMode:
    Description: Storage mode configured for the deployed Lambda.
    Value: !Ref FinancialsStorageDriver
