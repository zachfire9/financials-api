name: Deploy Financials API

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: financials-api-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  API_STACK_NAME: ${{ vars.API_STACK_NAME || 'financials-api' }}
  FINANCIALS_STORAGE_DRIVER: ${{ vars.FINANCIALS_STORAGE_DRIVER || 'ephemeral' }}
  FINANCIALS_ALLOWED_ORIGINS: ${{ vars.FINANCIALS_ALLOWED_ORIGINS }}
  FINANCIALS_THROTTLING_RATE_LIMIT: ${{ vars.FINANCIALS_THROTTLING_RATE_LIMIT || '2' }}
  FINANCIALS_THROTTLING_BURST_LIMIT: ${{ vars.FINANCIALS_THROTTLING_BURST_LIMIT || '5' }}
  FINANCIALS_RESERVED_CONCURRENCY: ${{ vars.FINANCIALS_RESERVED_CONCURRENCY }}

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  build:
    name: Build API artifact
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Build Lambda artifact
        run: sam build

      - name: Upload SAM build artifact
        uses: actions/upload-artifact@v4
        with:
          name: financials-api-sam-build
          path: .aws-sam/build/
          if-no-files-found: error

  deploy:
    name: Deploy API stack
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download SAM build artifact
        uses: actions/download-artifact@v4
        with:
          name: financials-api-sam-build
          path: .aws-sam/build

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy API stack
        env:
          FINANCIALS_ACCESS_TOKEN: ${{ secrets.FINANCIALS_ACCESS_TOKEN }}
        run: |
          # sam rejects empty "Key=" overrides with a usage error (exit 2),
          # so optional parameters are only passed when they have a value.
          PARAMS=(
            "FinancialsStorageDriver=$FINANCIALS_STORAGE_DRIVER"
            "FinancialsThrottlingRateLimit=$FINANCIALS_THROTTLING_RATE_LIMIT"
            "FinancialsThrottlingBurstLimit=$FINANCIALS_THROTTLING_BURST_LIMIT"
          )
          if [ -n "$FINANCIALS_ALLOWED_ORIGINS" ]; then
            PARAMS+=("FinancialsAllowedOrigins=$FINANCIALS_ALLOWED_ORIGINS")
          fi
          if [ -n "$FINANCIALS_ACCESS_TOKEN" ]; then
            PARAMS+=("FinancialsAccessToken=$FINANCIALS_ACCESS_TOKEN")
          fi
          if [ -n "$FINANCIALS_RESERVED_CONCURRENCY" ]; then
            PARAMS+=("FinancialsReservedConcurrency=$FINANCIALS_RESERVED_CONCURRENCY")
          fi

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$API_STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${PARAMS[@]}"

      - name: Smoke test health endpoint
        run: |
          API_BASE_URL=$(aws cloudformation describe-stacks \
            --stack-name "$API_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='FinancialsApiUrl'].OutputValue | [0]" \
            --output text)
          echo "API base URL: $API_BASE_URL"
          curl --fail --silent --show-error "$API_BASE_URL/health"
